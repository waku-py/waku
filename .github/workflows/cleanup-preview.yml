name: Cleanup Preview Deployments

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  cleanup-branch:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Delete preview deployments for closed PR branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          PROJECT="wakupy"
          API_BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments"
          PAGE=1

          while true; do
            if ! RESPONSE=$(curl -sf \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$API_BASE?env=preview&page=$PAGE&per_page=25"); then
              echo "::error::Failed to fetch deployments (page $PAGE)"
              exit 1
            fi

            IDS=$(echo "$RESPONSE" | jq -r --arg branch "$BRANCH" '.result[] | select(.deployment_trigger.metadata.branch == $branch) | .id')
            TOTAL_PAGES=$(echo "$RESPONSE" | jq -r '.result_info.total_pages // 1')

            for ID in $IDS; do
              echo "Deleting deployment $ID for branch $BRANCH"
              curl -sf -X DELETE \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "$API_BASE/$ID?force=true" || echo "::warning::Failed to delete deployment $ID"
            done

            if [ "$PAGE" -ge "$TOTAL_PAGES" ]; then
              break
            fi
            PAGE=$((PAGE + 1))
          done

          echo "Cleaned up preview deployments for branch: $BRANCH"

  cleanup-stale:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Delete preview deployments for deleted branches
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PROJECT="wakupy"
          API_BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments"

          REMOTE_BRANCHES=$(gh api repos/${{ github.repository }}/branches --paginate --jq '.[].name' | sort)

          PAGE=1
          DELETED=0

          while true; do
            if ! RESPONSE=$(curl -sf \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$API_BASE?env=preview&page=$PAGE&per_page=25"); then
              echo "::error::Failed to fetch deployments (page $PAGE)"
              exit 1
            fi

            DEPLOYMENTS=$(echo "$RESPONSE" | jq -r '.result[] | "\(.id) \(.deployment_trigger.metadata.branch)"')
            TOTAL_PAGES=$(echo "$RESPONSE" | jq -r '.result_info.total_pages // 1')

            while IFS=' ' read -r ID BRANCH; do
              [ -z "$ID" ] && continue
              if ! echo "$REMOTE_BRANCHES" | grep -qxF "$BRANCH"; then
                echo "Deleting deployment $ID (branch '$BRANCH' no longer exists)"
                curl -sf -X DELETE \
                  -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                  "$API_BASE/$ID?force=true" || echo "::warning::Failed to delete deployment $ID"
                DELETED=$((DELETED + 1))
              fi
            done <<< "$DEPLOYMENTS"

            if [ "$PAGE" -ge "$TOTAL_PAGES" ]; then
              break
            fi
            PAGE=$((PAGE + 1))
          done

          echo "Cleaned up $DELETED stale preview deployments"
