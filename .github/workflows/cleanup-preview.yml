name: Cleanup Preview Deployments

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  cleanup-branch:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Delete preview deployments for closed PR branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          PROJECT="wakupy"
          API_BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments"

          ALL_IDS=""
          PAGE=1
          while true; do
            if ! RESPONSE=$(curl -sf \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$API_BASE?env=preview&page=$PAGE&per_page=25"); then
              echo "::error::Failed to fetch deployments (page $PAGE)"
              exit 1
            fi

            IDS=$(echo "$RESPONSE" | jq -r --arg branch "$BRANCH" \
              '.result[] | select(.deployment_trigger.metadata.branch == $branch) | .id')

            if [ -n "$IDS" ]; then
              ALL_IDS=$(printf '%s\n%s' "$ALL_IDS" "$IDS")
            fi

            TOTAL_PAGES=$(echo "$RESPONSE" | jq -r '.result_info.total_pages // 1')
            if [ "$PAGE" -ge "$TOTAL_PAGES" ]; then
              break
            fi
            PAGE=$((PAGE + 1))
          done

          DELETED=0
          for ID in $ALL_IDS; do
            [ -z "$ID" ] && continue
            echo "Deleting deployment $ID for branch $BRANCH"
            if curl -sf -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$API_BASE/$ID?force=true"; then
              DELETED=$((DELETED + 1))
            else
              echo "::warning::Failed to delete deployment $ID"
            fi
          done

          echo "Cleaned up $DELETED preview deployments for branch: $BRANCH"

  cleanup-stale:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Delete preview deployments for deleted branches
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PROJECT="wakupy"
          API_BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments"

          REMOTE_BRANCHES=$(gh api repos/${{ github.repository }}/branches --paginate --jq '.[].name' | sort)

          ALL_IDS=""
          PAGE=1
          while true; do
            if ! RESPONSE=$(curl -sf \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$API_BASE?env=preview&page=$PAGE&per_page=25"); then
              echo "::error::Failed to fetch deployments (page $PAGE)"
              exit 1
            fi

            DEPLOYMENTS=$(echo "$RESPONSE" | jq -r '.result[] | "\(.id) \(.deployment_trigger.metadata.branch)"')

            while IFS=' ' read -r ID BRANCH; do
              [ -z "$ID" ] && continue
              if ! echo "$REMOTE_BRANCHES" | grep -qxF "$BRANCH"; then
                ALL_IDS=$(printf '%s\n%s' "$ALL_IDS" "$ID")
              fi
            done <<< "$DEPLOYMENTS"

            TOTAL_PAGES=$(echo "$RESPONSE" | jq -r '.result_info.total_pages // 1')
            if [ "$PAGE" -ge "$TOTAL_PAGES" ]; then
              break
            fi
            PAGE=$((PAGE + 1))
          done

          DELETED=0
          for ID in $ALL_IDS; do
            [ -z "$ID" ] && continue
            echo "Deleting stale deployment $ID"
            if curl -sf -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$API_BASE/$ID?force=true"; then
              DELETED=$((DELETED + 1))
            else
              echo "::warning::Failed to delete deployment $ID"
            fi
          done

          echo "Cleaned up $DELETED stale preview deployments"
