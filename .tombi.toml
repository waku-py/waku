# Tombi configuration for Cargo.toml and pyproject.toml.
# Keep the stable TOML version used by Cargo and Python tooling.
toml-version = "v1.0.0"

[files]
include = ["**/*.toml"]
respect-ignore-files = true

# Keep the formatter defaults, only align line width with the project.
[format.rules]
line-width = 120

# pyproject.toml schema: validation, completion, hover and navigation.
[[schemas]]
path = "tombi://www.schemastore.org/pyproject.json"
include = ["pyproject.toml", "**/pyproject.toml"]

# Defensive: disable schema-driven ordering as well.
format.rules.array-values-order.enabled = false
format.rules.table-keys-order.enabled = false

lint.rules.deprecated = "warn"

# Do not let Tombi rewrite pyproject.toml at all.
# Schema validation and other LSP features remain enabled.
[[overrides]]
[overrides.files]
include = ["pyproject.toml", "**/pyproject.toml"]

[overrides.format]
enabled = false
