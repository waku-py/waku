{% extends "base.html" %}

{% block scripts %}
  {{ super() }}
  <script src="https://context7.com/widget.js" data-library="/waku-py/waku" data-color="#7e57c2"></script>
  <script>
    (function() {
      function addDeepWikiButton() {
        if (document.querySelector('.deepwiki-btn')) return;
        var title = document.querySelector('.md-header__title');
        if (!title) return;
        var link = document.createElement('a');
        link.href = 'https://deepwiki.com/waku-py/waku';
        link.target = '_blank';
        link.rel = 'noopener';
        link.className = 'deepwiki-btn';
        link.title = 'Ask DeepWiki';
        link.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span>Ask DeepWiki</span>';
        title.after(link);
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', addDeepWikiButton);
      } else {
        addDeepWikiButton();
      }
      document.addEventListener('DOMContentSwitch', addDeepWikiButton);
    })();
  </script>
{% endblock %}
