[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[project]
name = "waku"
version = "0.43.0"
description = "Python framework for backends that grow"
readme = "README.md"
license = "MIT"
keywords = ["architecture", "modular", "decoupled", "framework", "dishka", "ioc", "di", "messaging", "eventstore", "eventsourcing", "cqrs", "wolverine", "critter"]
authors = [
  { name = "Daniil Kharkov", email = "fadeddexofan@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
dependencies = [
  "adaptix>=3.0.0b12",
  "anyio>=4.14.1",
  "dishka>=1.10.1",
  "typing-extensions>=4.15.0,<4.16",
]

[project.optional-dependencies]
faststream = ["faststream>=0.7.1"]
sqla = ["sqlalchemy[asyncio]>=2.0.51"]

[project.urls]
Repository = "https://github.com/waku-py/waku"
Documentation = "https://docs.wakupy.dev/"
Changelog = "https://github.com/waku-py/waku/blob/master/CHANGELOG.md"
Issues = "https://github.com/waku-py/waku/issues"

[dependency-groups]
dev = [
  "pysentry-rs>=0.4.7",
]
docs = [
  "mkdocstrings[python]>=1.0.4",
  "zensical>=0.0.47",
]
lint = [
  "deptry>=0.25.1",
  "gitlint>=0.19.1",
  "import-linter>=2.13",
  "prek>=0.4.6",
  "ruff>=0.15.20",
]
test = [
  "coverage>=7.15.0",
  "psycopg[binary]>=3.3.4",
  "pytest>=9.1.1",
  "pytest-clarity>=1.0.1",
  "pytest-cov>=7.1.0",
  "pytest-deadfixtures>=3.1.0",
  "pytest-mock>=3.15.1",
  "pytest-randomly>=4.1.0",
  "pytest-timeout>=2.4.0",
  "faststream[kafka, rabbit]>=0.7.1",
  "sqlalchemy[asyncio]>=2.0.51",
  "testcontainers[postgres]>=4.14.2",
  "uvloop>=0.22.1; sys_platform != 'win32' and python_version < '3.14'",
]
typecheck = [
  "mypy[faster-cache]>=2.1.0",
  "pyrefly>=1.1.1",
  "ty>=0.0.56",
  "zuban>=0.9.0"
]

# ----- UV settings -----
[tool.uv]
default-groups = "all"
required-version = ">=0.11.26"
override-dependencies = ["click>=8.4.2"]

# ----- Pytest settings -----
[tool.pytest.ini_options]
xfail_strict = true
norecursedirs = ".* docs examples site __pycache__"
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true
addopts = [
  "--doctest-modules",
  "--strict-markers",
  "--strict-config",
  "--cov-fail-under=98",
  "-W error::RuntimeWarning",
]
# pytest-timeout settings
timeout = 15
session_timeout = 100

# ----- Coverage settings -----
[tool.coverage.run]
branch = true
source = ["src", "tests"]
omit = ["*__dishka_factory_*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
omit = ["*__dishka_factory_*"]
exclude_also = [
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if (?:t(yping)?\\.)?TYPE_CHECKING:",
  "@(?:t(yping)?\\.)?overload",
  "@(abc\\.)?abstractmethod",
  "class .*\\(.*\\bProtocol\\b.*\\):",
  "(?:t(yping)?\\.)?assert_never",
]


# ----- Import Linter settings -----
[tool.importlinter]
root_packages = ["waku"]

[[tool.importlinter.contracts]]
name = "Messaging and event sourcing are independent siblings"
type = "independence"
modules = ["waku.messaging", "waku.eventsourcing"]
# Siblings: neither may import the other in EITHER direction (closes the lateral back-edge that a
# one-directional `forbidden` contract could not catch). The integration package
# (waku.integrations.eventsourcing_messaging) is the sole sanctioned both-importer; it is NOT listed
# here, so its imports of both siblings are allowed.

[[tool.importlinter.contracts]]
name = "Neutral messages package does not import messaging"
type = "forbidden"
source_modules = ["waku.messages"]
forbidden_modules = ["waku.messaging"]
# waku.messages is the neutral wire-contract package (IMessage/IEvent/MessageIdentity); it must stay
# dependency-free so messaging and event sourcing can both source the markers without a back-edge.

[[tool.importlinter.contracts]]
name = "Neutral serialization package stays inward-only"
type = "forbidden"
source_modules = ["waku.serialization"]
forbidden_modules = ["waku.messaging", "waku.eventsourcing"]
# waku.serialization is the shared codec/versioning package; it depends only on waku.messages +
# waku._internal + adaptix, so messaging and event sourcing can both source it without a back-edge.


# ----- Ruff settings -----
[tool.ruff]
unsafe-fixes = true
show-fixes = true
line-length = 120
target-version = "py311"
extend-exclude = ["pyproject.toml"]

[tool.ruff.lint]
preview = true
extend-select = ["ALL"]
ignore = [
  "A005", # Module is shadowing a Python builtin module
  "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
  "COM812", # Trailing comma missing. Conflicts with ruff format
  "CPY", # flake8-copyright
  "D1", # All 1xx pydocstyle codes
  "D203", # 1 blank line required before class docstring
  "D213", # Multi-line docstring summary should start at the second line
  "DOC201", # `return` is not documented in docstring
  "DOC502", # Raised exception is not explicitly raised
  "E501", # Never enforce line length
  "ISC001", # Implicitly concatenated string literals on one line. Conflicts with ruff format
  "RET504", # Unnecessary variable assignment before `return` statement
  "RUF001", # ruff unicode specific rules
  "RUF002", # ruff unicode specific rules
  "RUF003", # ruff unicode specific rules
  "TD", # flake8-todos
  "TRY003", # Duplicates EM101 warning
]
unfixable = [
  "B", # Avoid trying to fix flake8-bugbear violations.
  "ERA", # Avoid deleting commented-out code
]

flake8-quotes = { inline-quotes = "single", multiline-quotes = "double" }
mccabe = { max-complexity = 10 }
pydocstyle = { convention = "google" }
pylint = { max-args = 7 }

[tool.ruff.lint.per-file-ignores]
"docs/code/*" = [
  "ARG001", # Unused function argument
  "ARG002", # Unused method argument
  "I001", # Import block is un-sorted or un-formatted
  "INP001", # File is part of an implicit namespace package
  "PLR2004", # Magic value used in comparison
  "PLR6301", # Method could be a function, class method, or static method
  "RUF029", # Function is declared async but doesn't use async features
  "S101", # Usage of assert
  "SIM117", # Multiple with-statements should be combined
  "TC001",
  "T201", # `print` found
]
"examples/*" = [
  "ARG001", # Unused function argument
  "INP001", # File is part of an implicit namespace package
  "PLR6301", # Method could be a function, class method, or static method
  "RUF029", # Function is declared async but doesn't use async features
  "S101", # Usage of assert
  "SIM117", # Multiple with-statements should be combined
  "T201", # `print` found
  "TRY400", # Use `logging.exception` instead of `logging.error
]
"tests/*" = [
  "FBT001", # Boolean-typed positional argument in function definition
  "N806", # Variable in function should be lowercase
  "PLR2004", # Magic value comparison
  "RUF069", # Unreliable floating point equality comparison
  "S101", # Usage of assert
  "S311", # Usage of non-cryptographic random
  "TC001", # Move application import into a type-checking block
  "TRY002", # Raise Exception or BaseException directly
]


[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Base framework errors have ONE home: waku.exceptions. waku.messaging.exceptions re-exports them for
# aggregation, but per feedback_single_home_over_reexport we import the base error from its definition site
# and keep waku.messaging.exceptions for messaging-specific subclasses (HandlerAlreadyRegistered, etc.) only.
"waku.messaging.exceptions.ImproperlyConfiguredError".msg = "Import ImproperlyConfiguredError from waku.exceptions (single home); waku.messaging.exceptions is only for messaging-specific subclasses."
"waku.messaging.exceptions.WakuError".msg = "Import WakuError from waku.exceptions (single home)."

[tool.ruff.lint.isort]
force-wrap-aliases = true
combine-as-imports = true
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "tests",
  "local-folder",
]

[tool.ruff.lint.isort.sections]
tests = ["tests"]

[tool.ruff.format]
preview = true
quote-style = "single"
docstring-code-format = true


# ----- Deptry settings -----
[tool.deptry]
extend_exclude = ["docs"]
known_first_party = ["waku"]

[tool.deptry.per_rule_ignores]
DEP002 = ["psycopg"]
DEP004 = ["gitlint", "pytest", "sqlalchemy"]


# ----- Mypy settings -----
[tool.mypy]
# Mypy configuration:
# https://mypy.readthedocs.io/en/latest/config_file.html
exclude = [
  "benchmarks",
  "docs/code/eventsourcing",
  "docs/code/getting_started",
  "docs/code/integrations",
  "docs/code/providers",
]
enable_incomplete_feature = ["TypeForm"]
exclude_gitignore = true
follow_imports = "normal"
allow_redefinition_new = true
# Any is 'ok' as long as it is a wildcard
disallow_any_explicit = false
ignore_errors = false
ignore_missing_imports = false
implicit_reexport = false
local_partial_types = true
strict = true
strict_optional = true
show_error_codes = true
no_implicit_optional = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
module = "gitlint.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiokafka.*"
ignore_missing_imports = true


# ----- ty settings -----
[tool.ty.environment]
python = "./.venv"
python-version = "3.11"

[tool.ty.src]
exclude = [
  "docs/code/eventsourcing",
  "docs/code/getting_started",
  "docs/code/integrations",
  "docs/code/providers",
]

[tool.ty.rules]
unused-type-ignore-comment = "ignore"


# ----- Zuban settings -----
[tool.zuban]
mode = "default"


# ----- Semantic release settings -----
[tool.semantic_release]
build_command = """
    command -v uv 2>/dev/null || pip install uv==0.11.27
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""
assets = []
commit_message = "chore(release): {version} [skip ci]"
commit_parser = "conventional"
logging_use_named_masks = true
major_on_zero = false
allow_zero_version = true
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "(master|main)"
prerelease = false
prerelease_token = "rc"

[tool.semantic_release.branches.other]
match = ".*"
prerelease = true
prerelease_token = "dev"

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"
template_dir = "config/release-templates"
exclude_commit_patterns = [
  '''Merged? .*''',
  '''build\((?!deps\): .+)''',
  '''chore(?:\([^)]*?\))?: .+''',
  '''ci(?:\([^)]*?\))?: .+''',
  '''refactor(?:\([^)]*?\))?: .+''',
  '''style(?:\([^)]*?\))?: .+''',
  '''test(?:\([^)]*?\))?: .+''',
]

[tool.semantic_release.changelog.environment]
autoescape = true

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "semantic-release <semantic-release>"

[tool.semantic_release.commit_parser_options]
# Also used in `gitlint_plugins.py` for allowed commit types check
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
default_bump_level = 0
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.remote]
name = "origin"
type = "github"

[tool.semantic_release.publish]
upload_to_vcs_release = true
